  <text x="60.0" y="310.0" font-size="15" font-weight="400" text-anchor="start" fill="#0e7c3f" font-family="Segoe UI, Helvetica, Arial, sans-serif">✓ np.unpackbits(row, count=n, bitorder="little")  →  1 0 1 1 0 0 1 0</text>
  <text x="60.0" y="338.0" font-size="15" font-weight="400" text-anchor="start" fill="#a33232" font-family="Segoe UI, Helvetica, Arial, sans-serif">✗ np.unpackbits(row, count=n) — NumPy defaults to "big"  →  0 1 0 0 1 1 0 1</text>
  <text x="60.0" y="372.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">The default silently reverses every byte: detector 0 reads detector 7's value,</text>
  <text x="60.0" y="392.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">nothing crashes, and the file stays well-formed.</text>
  <text x="60.0" y="422.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">Packed width never implies true width either — a 3-byte row holds 17 to 24 detectors.</text>
  <text x="60.0" y="442.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">Read n_detectors from the manifest, never from the array shape.</text>
