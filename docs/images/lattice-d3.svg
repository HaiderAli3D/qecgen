  <text x="338.0" y="109" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f1d" font-family="Segoe UI, Helvetica, Arial, sans-serif">data qubit — 3×3 = 9</text>
  <rect x="306.0" y="134" width="20" height="20" fill="#3a2e6e"/>
  <text x="338.0" y="149" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f1d" font-family="Segoe UI, Helvetica, Arial, sans-serif">Z stabilizer — 4</text>
  <rect x="306.0" y="174" width="20" height="20" fill="#0e7c7b"/>
  <text x="338.0" y="189" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f1d" font-family="Segoe UI, Helvetica, Arial, sans-serif">X stabilizer — 4</text>
  <text x="306.0" y="232" font-size="15" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">8 stabilizers = d² − 1</text>
  <text x="306.0" y="256" font-size="15" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">× 3 rounds = 24 detectors per shot</text>
  <text x="306.0" y="280" font-size="15" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">(rounds defaults to d)</text>
  <text x="30.0" y="308.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">Half-disc plaquettes are the weight-2 boundary checks; interior checks are weight 4.</text>
  <text x="30.0" y="328.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#5d645f" font-family="Segoe UI, Helvetica, Arial, sans-serif">Geometry identical to the figure the tool itself draws.</text>
